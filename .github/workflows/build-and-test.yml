name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Test on multiple platforms
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev xvfb

    - name: Install dependencies
      run: go mod download

    - name: Run tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: xvfb-run -a go test -v -race ./...

    - name: Run tests (macOS/Windows)
      if: matrix.os != 'ubuntu-latest'
      run: go test -v -race ./...

  # Desktop builds for native platforms (cross-compilation handled by GoReleaser in releases)
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache: true

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev

    - name: Build
      run: go build -v .

  # WASM build (critical - this catches WASM-specific issues)
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache: true

    - name: Build WASM
      env:
        GOOS: js
        GOARCH: wasm
        CGO_ENABLED: 0
      run: |
        echo "Building WASM binary..."
        go build -v -o web/verdant-thane.wasm .

        echo "Checking binary size..."
        ls -lh web/verdant-thane.wasm

        # Fail if binary is unreasonably large (>60MB suggests asset duplication)
        SIZE=$(stat -f%z web/verdant-thane.wasm 2>/dev/null || stat -c%s web/verdant-thane.wasm)
        if [ $SIZE -gt 62914560 ]; then
          echo "Error: WASM binary is too large ($SIZE bytes, expected <60MB)"
          echo "This may indicate duplicate asset embedding or other issues"
          exit 1
        fi

        echo "Binary size: $SIZE bytes (OK)"

    - name: Copy wasm_exec.js
      run: |
        # Try Go 1.25+ location first
        if [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
        elif [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web/
        else
          echo "Error: wasm_exec.js not found in Go installation"
          exit 1
        fi

    - name: Verify deployment files
      run: |
        echo "Verifying all required files exist..."
        test -f web/index.html || (echo "Missing web/index.html" && exit 1)
        test -f web/wasm_exec.js || (echo "Missing web/wasm_exec.js" && exit 1)
        test -f web/verdant-thane.wasm || (echo "Missing web/verdant-thane.wasm" && exit 1)
        test -f web/README.md || (echo "Missing web/README.md" && exit 1)
        echo "✓ All deployment files present"

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: verdant-thane-wasm
        path: |
          web/*.html
          web/*.js
          web/*.wasm
          web/README.md
        retention-days: 7

  # WASM-specific tests (if applicable)
  test-wasm:
    name: Test WASM Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache: true

    - name: Verify WASM compilation
      env:
        GOOS: js
        GOARCH: wasm
      run: |
        # Verify that code compiles for WASM (can't execute WASM tests on Linux)
        echo "Verifying WASM compilation of test packages..."
        go test -c -o /tmp/persistence-wasm.test ./persistence
        echo "✓ Persistence package compiles for WASM"

    - name: Check for forbidden imports
      run: |
        echo "Checking for WASM-incompatible imports..."

        # Files with WASM build tag should not import these packages
        FORBIDDEN_IMPORTS="os/user"

        for pkg in $FORBIDDEN_IMPORTS; do
          if grep -r "import.*\"$pkg\"" --include="*_wasm.go" .; then
            echo "Error: WASM files should not import $pkg"
            exit 1
          fi
        done

        echo "✓ No forbidden imports found"

  # Build check for build script
  test-build-script:
    name: Test Build Script
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache: true

    - name: Make script executable
      run: chmod +x scripts/build-wasm.sh

    - name: Run build script
      run: ./scripts/build-wasm.sh

    - name: Verify build succeeded
      run: |
        test -f web/verdant-thane.wasm || (echo "Build script failed to create WASM binary" && exit 1)
        test -f web/wasm_exec.js || (echo "Build script failed to copy wasm_exec.js" && exit 1)
        echo "✓ Build script succeeded"
