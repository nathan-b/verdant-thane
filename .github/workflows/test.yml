name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Run tests
      run: go test -v ./...

    - name: Test build (Linux amd64)
      run: go build -v .

    - name: Test cross-compile (Windows amd64)
      run: GOOS=windows GOARCH=amd64 go build -v .
