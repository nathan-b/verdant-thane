name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev xvfb

    - name: Run tests
      run: xvfb-run -a go test -v $(go list ./... | grep -v /tools)

    - name: Test build (Linux amd64)
      run: go build -v .

    - name: Test cross-compile (Windows amd64)
      run: GOOS=windows GOARCH=amd64 go build -v .
